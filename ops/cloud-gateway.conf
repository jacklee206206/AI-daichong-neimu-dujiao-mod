map $http_cf_ipcountry $blocked_country {
    default 0;
    CN 1;
}

map $uri $payment_callback {
    default 0;
    /api/v1/payments/callback 1;
    /api/v1/payments/webhook/dujiaopay 1;
    /api/v1/payments/webhook/paypal 1;
    /api/v1/payments/webhook/stripe 1;
}

map "$blocked_country:$payment_callback" $deny_request {
    default 0;
    "1:0" 1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8081;
    server_name _;
    client_max_body_size 20m;

    if ($deny_request) {
        return 403 "Access unavailable in your region.\n";
    }

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
